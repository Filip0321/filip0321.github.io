<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zimmer - Filip Winkler</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/steuerung.css">
  <link rel="stylesheet" href="zimmer.css">
</head>
<body class="zimmer-seite">
  <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menü</button>

  <nav id="menu" class="menu">
    <ul>
      <li><a href="/">Start</a></li>
      <li><a href="/projekte/">Projekte</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </nav>

  <main class="zimmer-buehne">
    <h1 class="nur-vorleser">Filip Winkler: Zimmer</h1>
    <canvas id="zimmer" aria-label="Ein Zimmer. Die Gegenstände darin sind Links."></canvas>
    <div id="dinge" class="zimmer-dinge"></div> <!-- die Links über den Gegenständen baut js/main.js aus zimmer.json -->
    <p id="meldung" class="zimmer-meldung" hidden></p>

    <!-- Bearbeiten: ?bearbeiten an die Adresse hängen oder B drücken -->
    <aside id="leiste" class="zimmer-leiste" hidden>
      <div class="steuerung">
        <label class="datei-knopf">Scan öffnen (.ply, .splat) <input type="file" id="datei" accept=".ply,.splat"></label>
        <label>Blick
          <select id="leiste-art">
            <option value="parallax">Parallaxe (wie die Startseite)</option>
            <option value="frei">frei (ziehen, Rad, Umschalt + ziehen)</option>
          </select>
        </label>
        <button type="button" id="drehen-x">90° um x</button>
        <button type="button" id="drehen-y">90° um y</button>
        <button type="button" id="drehen-z">90° um z</button>
        <button type="button" id="ansicht-merken">Blick als Start</button>
      </div>
      <h2>Gegenstände</h2>
      <ul id="leiste-liste" class="zimmer-liste"></ul>
      <div class="steuerung">
        <button type="button" id="ding-setzen">neuer Gegenstand (dann ins Bild klicken)</button>
        <label>Name <input type="text" id="ding-name"></label>
        <label>Link <input type="text" id="ding-link"></label>
        <label>Größe (Radius) <input type="number" id="ding-radius" min="0.01" step="0.01"></label>
        <button type="button" id="ding-loeschen">löschen</button>
      </div>
      <div class="steuerung">
        <button type="button" id="json">zimmer.json kopieren</button>
      </div>
      <p class="hinweis">B blendet diese Leiste aus und ein. Die kopierte zimmer.json neben index.html legen; dazu die Scan-Datei, deren Name unter „splats“ steht.</p>
    </aside>
  </main>

  <script src="/script.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
