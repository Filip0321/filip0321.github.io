<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Life - Filip Winkler</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/canvas.css">
  <link rel="stylesheet" href="/css/steuerung.css">
  <link rel="stylesheet" href="/css/export-dialog.css">
  <link rel="stylesheet" href="/css/text.css">
</head>
<body>
  <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menü</button>

  <nav id="menu" class="menu">
    <ul>
      <li><a href="/">Start</a></li>
      <li><a href="/projekte/">Projekte</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </nav>

  <!-- werkbank: hochkant untereinander, quer Canvas links und Bedienung rechts (css/canvas.css) -->
  <main class="seite werkbank">
    <header class="projekt-kopf">
      <a class="zurueck" href="/projekte/">← Projekte</a>
      <h1>Game of Life</h1>
      <ul class="tags">
        <li>simulation</li>
      </ul>
    </header>

    <div class="feld-rahmen">
      <div class="feld-stapel">
        <canvas id="feld" class="gol-feld"></canvas>
        <canvas id="effekte" class="gol-feld schicht" hidden></canvas>
      </div>
    </div>

    <div class="bedienung">
      <details class="abschnitt" open>
        <summary>Spiel</summary>
        <div class="steuerung">
          <button type="button" id="start">Pause</button>
          <button type="button" id="schritt">Schritt</button>
          <button type="button" id="leeren">Leeren</button>
          <button type="button" id="neu">Zufall</button>
        </div>
        <div class="steuerung">
          <label>Größe
            <input type="range" id="stufen" min="1" max="8" value="2">
            <output id="stufenwert">2</output>
          </label>
        </div>
      </details>

      <details class="abschnitt" open>
        <summary>Muster</summary>
        <div class="presets" role="group" aria-label="Muster"></div>
        <details class="preset-info" open>
          <summary id="preset-name"></summary>
          <p id="preset-text"></p>
        </details>
      </details>

      <details class="abschnitt">
        <summary>Regeln</summary>
        <!-- Regeln: Conway ist 2 und 3 zum Überleben, 3 zum Beleben -->
        <div class="steuerung">
          <label>Nachbar zum Leben 1 <input type="number" id="nachbar1" min="0" max="8" step="1"></label>
          <label>Nachbar zum Leben 2 <input type="number" id="nachbar2" min="0" max="8" step="1"></label>
          <label>Nachbar zum Beleben <input type="number" id="nachbar3" min="1" max="8" step="1"></label>
        </div>
      </details>

      <details class="abschnitt">
        <summary>Effekte</summary>
        <div data-effekt-regler="vhs"></div> <!-- Häkchen und Regler baut /lib/effekt-regler.js -->
        <div data-effekt-regler="crt"></div> <!-- Häkchen und Regler baut /lib/effekt-regler.js -->
      </details>

      <details class="abschnitt" open>
        <summary>Export</summary>
        <div class="steuerung export"></div>
      </details>
    </div>

  </main>

  <footer class="fuss">
    <a href="/impressum/">Impressum</a>
    <a href="/datenschutz/">Datenschutz</a>
  </footer>

  <script src="/script.js"></script>
  <script src="/lib/mediabunny.js"></script>
  <script type="module" src="gol.js"></script>
  <script type="module" src="/lib/effekt-schicht.js"></script>
</body>
</html>
