<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D-Attraktoren – Filip Winkler</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menü</button>

  <nav id="menu" class="menu">
    <ul>
      <li><a href="/">Start</a></li>
      <li><a href="/projekte/">Projekte</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </nav>

  <main class="seite">
    <a class="zurueck" href="/projekte/">← Projekte</a>

    <header class="projekt-kopf">
      <h1>2D-Attraktoren</h1>
      <ul class="tags">
        <li>simulation</li>
        <li>attraktor</li>
      </ul>
    </header>

    <canvas id="feld" class="attraktor-feld"></canvas>

    <div class="steuerung">
      <div class="modus" role="group" aria-label="Darstellung">
        <button type="button" id="modus-animiert" aria-pressed="true">Entstehen lassen</button>
        <button type="button" id="modus-sofort" aria-pressed="false">Sofort zeigen</button>
      </div>
      <label>Punkte <input type="number" id="punkte" min="1000" max="1000000" step="1000"></label>
      <label>Stärke <input type="number" id="staerke" min="1" max="255" step="1"></label>
    </div>

    <div class="steuerung export"></div>

    <div class="presets" role="group" aria-label="Presets"></div>

    <div class="werte">
      <label>a <input type="number" id="wert-a" step="0.01"></label>
      <label>b <input type="number" id="wert-b" step="0.01"></label>
      <label>c <input type="number" id="wert-c" step="0.01"></label>
      <label>d <input type="number" id="wert-d" step="0.01"></label>
    </div>

    <details class="preset-info" open>
      <summary id="preset-name"></summary>
      <pre class="formel" id="formel"></pre>
      <p id="preset-text"></p>
    </details>

    <section class="lesetext doku">
      <h2>Was ein Attraktor ist</h2>

      <details class="code" data-quelle="attraktor.js">
        <summary>Der Code</summary>
        <pre><code>Wird geladen …</code></pre>
      </details>
    </section>
    -->
    
  </main>

  <script src="/script.js"></script>
  <script src="/export.js"></script>
  <script src="attraktor.js"></script>
</body>
</html>
