<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foto Effekte - Filip Winkler</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menü</button>

  <nav id="menu" class="menu">
    <ul>
      <li><a href="/">Start</a></li>
      <li><a href="/projekte/">Projekte</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </nav>

  <main class="seite">
    <a class="zurueck" href="/projekte/">← Projekte</a>

    <header class="projekt-kopf">
      <h1>Foto Effekte</h1>
      <ul class="tags">
        <li>werkzeuge</li>
        <li>bild</li>
      </ul>
    </header>

    <p class="hinweis">Bilder und Videos werden im Browser bearbeitet und müssen selber nochmal heruntergeladen werden.</p>

    <div class="steuerung">
      <label class="datei-knopf">Öffnen
        <input type="file" id="datei" accept="image/*,video/*">
      </label>
      <label class="datei-knopf">Overlay hinzufügen
        <input type="file" id="overlay-datei" accept="image/*,video/*">
      </label>
      <button type="button" id="fenster-neu">Leeres Fenster</button>
      <label>Format
        <select id="format">
          <option value="original">Original</option>
          <option value="4:3">4:3 zuschneiden</option>
          <option value="balken">4:3 mit Balken</option>
        </select>
      </label>
      <label>Hintergrund
        <input type="color" id="hintergrund" value="#000000">
      </label>
      <label><input type="checkbox" id="transparent"> transparent lassen</label>
    </div>

    <canvas id="bild" class="bild-feld" hidden></canvas>

    <div class="steuerung">
      <label>Pixelgröße
        <input type="range" id="pixelgroesse" min="1" max="64" value="1">
        <output id="pixelwert">1</output>
      </label>
    </div>

    <div class="steuerung">
      <label><input type="checkbox" id="dither-an" data-zeigt="dither-regler"> Dithering</label>
    </div>
    <div class="steuerung" id="dither-regler" hidden>
      <label>Stufen
        <input type="range" id="stufen" min="2" max="8" value="2">
        <output id="stufenwert">2</output>
      </label>
      <label><input type="checkbox" id="grau" checked> Schwarzweiß</label>
    </div>

    <div class="steuerung">
      <label><input type="checkbox" id="vhs-an" data-zeigt="vhs-regler"> VHS</label>
    </div>
    <div class="regler-gruppen" id="vhs-regler" hidden>

      <details class="regler-gruppe">
        <summary>Band</summary>
        <div class="steuerung">
          <label>Wackeln
            <input type="range" data-regler="vhs.wackeln" min="0" max="10" step="0.5" value="3">
            <output></output>
          </label>
          <label>Tracking
            <input type="range" data-regler="vhs.tracking" min="0" max="300" step="1" value="0">
            <output></output>
          </label>
          <label>Tracking-Höhe
            <input type="range" data-regler="vhs.trackingHoehe" min="0" max="0.4" step="0.01" value="0.08">
            <output></output>
          </label>
          <label>Tracking-Tempo
            <input type="range" data-regler="vhs.trackingTempo" min="-1" max="1" step="0.01" value="0.1">
            <output></output>
          </label>
          <label>Tracking-Position
            <input type="range" data-regler="vhs.trackingPosition" min="0" max="1" step="0.01" value="0.5">
            <output></output>
          </label>
          <label>Bandrauschen
            <input type="range" data-regler="vhs.band" min="0" max="1" step="0.05" value="0.3">
            <output></output>
          </label>
          <label>Kopf-Höhe
            <input type="range" data-regler="vhs.kopfHoehe" min="0" max="0.15" step="0.005" value="0.04">
            <output></output>
          </label>
          <label>Kopf-Wackeln
            <input type="range" data-regler="vhs.kopfStaerke" min="0" max="20" step="0.5" value="6">
            <output></output>
          </label>
          <label>Kopf-Rauschen
            <input type="range" data-regler="vhs.kopfRauschen" min="0" max="1" step="0.05" value="0">
            <output></output>
          </label>
        </div>
      </details>

      <details class="regler-gruppe">
        <summary>Signal</summary>
        <div class="steuerung">
          <label>Weichzeichnen
            <input type="range" data-regler="vhs.weich" min="0" max="4" step="0.25" value="1">
            <output></output>
          </label>
          <label>Schärfe
            <input type="range" data-regler="vhs.schaerfe" min="0" max="3" step="0.05" value="0.5">
            <output></output>
          </label>
          <label>Schärfe-Breite
            <input type="range" data-regler="vhs.schaerfeBreite" min="1" max="8" step="0.5" value="2">
            <output></output>
          </label>
          <label>Geist-Abstand
            <input type="range" data-regler="vhs.geistAbstand" min="0" max="40" step="1" value="8">
            <output></output>
          </label>
          <label>Geist-Stärke
            <input type="range" data-regler="vhs.geistStaerke" min="-0.8" max="0.8" step="0.05" value="0">
            <output></output>
          </label>
          <label>Schwarzwert
            <input type="range" data-regler="vhs.schwarzwert" min="0" max="0.4" step="0.01" value="0.05">
            <output></output>
          </label>
          <label>Helligkeitsrauschen
            <input type="range" data-regler="vhs.hellRauschen" min="0" max="0.3" step="0.01" value="0.03">
            <output></output>
          </label>
        </div>
      </details>

      <details class="regler-gruppe">
        <summary>Farbe</summary>
        <div class="steuerung">
          <label>Farbbluten
            <input type="range" data-regler="vhs.bluten" min="0" max="20" step="1" value="8">
            <output></output>
          </label>
          <label>Farbverzögerung
            <input type="range" data-regler="vhs.farbVerzoegerung" min="-10" max="10" step="0.5" value="2">
            <output></output>
          </label>
          <label>Sättigung
            <input type="range" data-regler="vhs.saettigung" min="0" max="1.5" step="0.05" value="0.8">
            <output></output>
          </label>
          <label>Regenbogen
            <input type="range" data-regler="vhs.regenbogen" min="0" max="8" step="0.1" value="0">
            <output></output>
          </label>
          <label>Regenbogen-Feinheit
            <input type="range" data-regler="vhs.regenbogenFeinheit" min="0.5" max="3" step="0.05" value="1.57">
            <output></output>
          </label>
          <label>Farbrauschen
            <input type="range" data-regler="vhs.farbRauschen" min="0" max="0.5" step="0.01" value="0.05">
            <output></output>
          </label>
          <label>Farbstich
            <input type="range" data-regler="vhs.farbstich" min="0" max="0.2" step="0.005" value="0">
            <output></output>
          </label>
          <label>Farbstich-Winkel
            <input type="range" data-regler="vhs.farbstichWinkel" min="0" max="360" step="1" value="200">
            <output></output>
          </label>
        </div>
      </details>

    </div>

    <div class="steuerung">
      <label><input type="checkbox" id="crt-an" data-zeigt="crt-regler"> CRT</label>
    </div>
    <div class="steuerung" id="crt-regler" hidden>
      <details class="regler-gruppe">
        <summary>Settings</summary>
        <div class="steuerung">
          <label>Farbversatz X
            <input type="range" data-regler="crt.versatzX" min="-20" max="20" step="1" value="4">
            <output></output>
          </label>
          <label>Farbversatz Y
            <input type="range" data-regler="crt.versatzY" min="-20" max="20" step="1" value="0">
            <output></output>
          </label>
          <label>Wölbung
            <input type="range" data-regler="crt.woelbung" min="-0.8" max="0.3" step="0.01" value="0.08">
            <output></output>
          </label>
          <label>Scanlines
            <input type="range" data-regler="crt.scanlines" min="0" max="1" step="0.05" value="0.3">
            <output></output>
          </label>
          <label>Vignette
            <input type="range" data-regler="crt.vignette" min="0" max="1" step="0.05" value="0.4">
            <output></output>
          </label>
          <label>Rauschen
            <input type="range" data-regler="crt.rauschen" min="0" max="0.3" step="0.01" value="0.05">
            <output></output>
          </label>
        </div>
      </details>
    </div>

    <div class="steuerung">
      <label><input type="checkbox" id="rahmen-an" data-zeigt="rahmen-regler"> Fenster ums Bild</label>
    </div>
    <div class="steuerung" id="rahmen-regler" hidden>
      <label>Titel
        <input type="text" id="rahmen-titel" value="Unbenannt">
      </label>
      <label>Abstand
        <input type="range" data-regler="rahmen.abstand" min="0" max="0.3" step="0.01" value="0.08">
        <output></output>
      </label>
    </div>

    <details class="regler-gruppe">
      <summary>Fenster-Stil</summary>
      <div class="steuerung">
        <label>Rahmenstärke
          <input type="range" data-regler="rahmen.staerke" min="0.05" max="0.6" step="0.01" value="0.2">
          <output></output>
        </label>
        <label>Schatten
          <input type="range" data-regler="rahmen.schattenDeckkraft" min="0" max="1" step="0.05" value="0.5">
          <output></output>
        </label>
        <label>Weichheit
          <input type="range" data-regler="rahmen.schattenWeich" min="0" max="0.08" step="0.002" value="0.02">
          <output></output>
        </label>
        <label>Versatz
          <input type="range" data-regler="rahmen.schattenVersatz" min="0" max="0.05" step="0.002" value="0.008">
          <output></output>
        </label>
      </div>
    </details>

    <ol class="kette" id="kette" aria-label="Reihenfolge der Effekte"></ol>

    <div id="overlay-auswahl" hidden>
      <p class="hinweis" id="overlay-name"></p>
      <div class="steuerung">
        <label>Größe
          <input type="range" id="overlay-groesse" min="0.02" max="1" step="0.01">
          <output id="overlay-groesse-wert"></output>
        </label>
        <label><input type="checkbox" id="overlay-fenster"> im Fenster</label>
        <label>Titel
          <input type="text" id="overlay-titel">
        </label>
        <button type="button" id="overlay-entfernen">Entfernen</button>
        <label>Drehung
          <input type="range" id="overlay-winkel" min="-180" max="180" step="1">
          <output id="overlay-winkel-wert"></output>
        </label>
        <label><input type="checkbox" id="overlay-schatten"> Schatten</label>
        <label id="overlay-verhaeltnis-feld">Höhe
          <input type="range" id="overlay-verhaeltnis" min="0.2" max="2" step="0.01">
          <output id="overlay-verhaeltnis-wert"></output>
        </label>
        <label>Deckkraft
          <input type="range" id="overlay-deckkraft" min="0" max="1" step="0.01">
          <output id="overlay-deckkraft-wert"></output>
        </label>
        <label>Mischmodus
          <select id="overlay-mischmodus">
            <option value="source-over">Normal</option>
            <option value="multiply">Multiplizieren</option>
            <option value="screen">Negativ multiplizieren</option>
            <option value="lighter">Addieren</option>
            <option value="overlay">Ineinanderkopieren</option>
            <option value="soft-light">Weiches Licht</option>
            <option value="hard-light">Hartes Licht</option>
            <option value="darken">Abdunkeln</option>
            <option value="lighten">Aufhellen</option>
            <option value="color-dodge">Farbig abwedeln</option>
            <option value="color-burn">Farbig nachbelichten</option>
            <option value="difference">Differenz</option>
            <option value="exclusion">Ausschluss</option>
            <option value="hue">Farbton</option>
            <option value="saturation">Sättigung</option>
            <option value="color">Farbe</option>
            <option value="luminosity">Luminanz</option>
          </select>
        </label>
        <label id="overlay-versatz-feld">Start bei
          <input type="number" id="overlay-versatz" min="0" step="0.1" value="0"> s
        </label>
      </div>
    </div>
    
    <div class="steuerung">
      <label>Vergleich
        <input type="range" id="vergleich" min="0" max="100" value="0">
        <output id="vergleichwert">0 %</output>
      </label>
    </div>

    <div class="steuerung nur-bild">
      <button type="button" id="speichern" disabled>Bild speichern</button>
      <label>Sekunden
        <input type="number" id="video-sekunden" min="1" max="30" step="1" value="5">
      </label>
      <button type="button" id="bild-video-speichern" disabled>Als Video speichern</button>
    </div>

    <div class="steuerung nur-video" hidden>
      <button type="button" id="abspielen">Pause</button>
      <button type="button" id="frame-speichern">Bild speichern</button>
      <button type="button" id="video-speichern">Video speichern</button>
    </div>

  </main>

  <footer class="fuss">
    <a href="/impressum/">Impressum</a>
    <a href="/datenschutz/">Datenschutz</a>
  </footer>

  <script src="/script.js"></script>
  <script src="/lib/mediabunny.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
